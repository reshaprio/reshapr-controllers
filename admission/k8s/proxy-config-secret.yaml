# Example configuration Secret consumed by the reShapr proxy sidecar injected by the
# admission controller. It must be deployed in the SAME namespace as the workloads that
# carry the `io.reshapr/inject: "true"` annotation, under the name `reshapr-proxy-config`
# (override with the `io.reshapr/config-secret-name` annotation).
#
# The `reshapr-cluster.jceks` binary key is intentionally omitted here — generate it and add
# it to the Secret as described in this directory's README.md. Prefer creating the whole
# Secret imperatively with `kubectl create secret generic ... --from-file=...` (see README).
#
# WARNING: replace every placeholder value below. Never commit real tokens or passwords.
apiVersion: v1
kind: Secret
metadata:
  name: reshapr-proxy-config
  labels:
    app.kubernetes.io/name: reshapr-proxy
    app.kubernetes.io/component: proxy-config
type: Opaque
stringData:
  # -- Control plane connection (gRPC)
  control-plane-host: "reshapr-control-plane-ctrl.reshapr-system"
  control-plane-port: "5555"
  control-plane-tls-plaintext: "true"
  # -- Gateway token issued by the control plane (sensitive)
  control-plane-token: "REPLACE_WITH_GATEWAY_TOKEN"
  # -- Gateway registration metadata
  gateway-fqdns: "REPLACE_WITH_GATEWAY_FQDNS"
  gateway-labels: "env=prod;team=reshapr"
  # -- JGroups SYM_ENCRYPT keystore passwords (sensitive)
  cluster-store-password: "REPLACE_WITH_STORE_PASSWORD"
  cluster-key-password: "REPLACE_WITH_KEY_PASSWORD"
# The keystore itself is binary and added separately, e.g.:
#   kubectl -n <namespace> patch secret reshapr-proxy-config \
#     --type merge -p "{\"data\":{\"reshapr-cluster.jceks\":\"$(base64 -i reshapr-cluster.jceks | tr -d '\n')\"}}"
# data:
#   reshapr-cluster.jceks: <base64-encoded JCEKS keystore>
