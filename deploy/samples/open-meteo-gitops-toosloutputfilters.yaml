apiVersion: reshapr.io/v1alpha1
kind: ToolsOutputFilters
metadata:
  name: open-meteo-gitops-filters
  annotations:
    reshapr.io/instance: reshapr-control-plane-ctrl.reshapr-system
    reshapr.io/organization: reshapr
spec:
  service:
    name: open-meteo-api
    version: '1.0'
  filters:
    getForecast:
      jsonRetain:
        - /daily
        - /current_weather
      compact: true
      convertToToon: true
