apiVersion: v1
kind: Namespace
metadata:
  name: reshapr-system

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reshapr-operator
  namespace: reshapr-system

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reshapr-operator
  namespace: reshapr-system
spec:
  replicas: 1
  selector:
    matchLabels:
      name: reshapr-operator
  template:
    metadata:
      labels:
        name: reshapr-operator
    spec:
      serviceAccountName: reshapr-operator
      containers:
        - name: reshapr-operator
          image: quay.io/lbroudoux/reshapr-operator:nightly
          imagePullPolicy: Always
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPERATOR_NAME
              value: reshapr-operator
          volumeMounts:
            - name: sa-token
              mountPath: /var/run/secrets/reshapr/serviceaccount
      volumes:
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: https://app.reshapr.io
                  expirationSeconds: 3600
                  path: token

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: reshapr-operator
rules:
  - apiGroups:
      - reshapr.io
    resources:
      - '*'
    verbs:
      - '*'

---
# Dedicated ClusterRole for reading Kubernetes Secrets referenced by SecretSource CRs
# via `spec.secrets[].valuesFrom.secretRef`. Kept separate from the main operator role so
# that cluster administrators can choose a stricter scope by binding it with a
# namespaced RoleBinding instead of the cluster-wide ClusterRoleBinding below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: reshapr-operator-secret-reader
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: reshapr-operator
subjects:
  - kind: ServiceAccount
    name: reshapr-operator
    namespace: reshapr-system
roleRef:
  kind: ClusterRole
  name: reshapr-operator
  apiGroup: ""

---
# Cluster-wide binding for Secret reads — since the operator watches SecretSource
# resources in all namespaces, it needs to read Secrets from those namespaces too.
# To restrict this to specific namespaces, replace this binding with one (or several)
# namespaced RoleBinding(s) referencing the `reshapr-operator-secret-reader` ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: reshapr-operator-secret-reader
subjects:
  - kind: ServiceAccount
    name: reshapr-operator
    namespace: reshapr-system
roleRef:
  kind: ClusterRole
  name: reshapr-operator-secret-reader
  apiGroup: ""
