name: build-container-images
on:
  workflow_call:
    inputs:
      image-tag:
        description: 'The tag to use for the images'
        required: true
        type: string

jobs:
  build-containers:
    if: github.repository_owner == 'reshaprio' && inputs.image-tag != ''
    runs-on: ubuntu-latest
    environment: Build
    permissions:
      contents: read
      packages: write
      id-token: write # needed for signing the images with GitHub OIDC Token

    steps:
      - name: Get current date
        id: date
        #run: echo "::set-output name=date::$(date +'%Y-%m-%dT%H:%M:%S')"
        run: echo "date=$(date +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.21

      - name: Set up JDK 25 for x64
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64
          cache: maven

      - name: Build Java components
        run: mvn -B -DskipTests clean install

      - name: Set IMAGE_TAG environment from input
        run: |
          set -x
          echo "IMAGE_TAG=${{ inputs.image-tag }}" >> "$GITHUB_ENV"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v3.7.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Quay.io and Docker Hub registries and setup multi-arch builder
        run: |
          echo ${{ secrets.QUAY_PASSWORD }} | docker login -u ${{ secrets.QUAY_USERNAME }} --password-stdin quay.io
          echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin docker.io
          BUILDER=buildx-multi-arch
          docker buildx inspect $BUILDER || docker buildx create --name=$BUILDER --driver=docker-container --driver-opt=network=host

      - name: Build and push container image for operator
        id: build-and-push-operator
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{github.workspace}}/operator
          sbom: true
          push: true
          provenance: mode=max
          platforms: linux/amd64,linux/arm64
          builder: buildx-multi-arch
          file: operator/src/main/docker/Dockerfile.jvm
          labels: |
            org.opencontainers.image.revision=${GITHUB_SHA}
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
          tags: quay.io/reshapr/reshapr-operator:${{env.IMAGE_TAG}},docker.io/reshapr/reshapr-operator:${{env.IMAGE_TAG}}

      - name: Build and push container image for admission
        id: build-and-push-admission
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{github.workspace}}/admission
          sbom: true
          push: true
          provenance: mode=max
          platforms: linux/amd64,linux/arm64
          builder: buildx-multi-arch
          file: admission/src/main/docker/Dockerfile.jvm
          labels: |
            org.opencontainers.image.revision=${GITHUB_SHA}
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
          tags: quay.io/reshapr/reshapr-admission:${{env.IMAGE_TAG}},docker.io/reshapr/reshapr-admission:${{env.IMAGE_TAG}}

      - name: Sign the operator image with GitHub OIDC Token
        env:
          DIGEST: ${{ steps.build-and-push-operator.outputs.digest }}
          TAGS: quay.io/reshapr/reshapr-operator:${{env.IMAGE_TAG}} docker.io/reshapr/reshapr-operator:${{env.IMAGE_TAG}}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --new-bundle-format=false --use-signing-config=false --yes ${images}

      - name: Sign the admission image with GitHub OIDC Token
        env:
          DIGEST: ${{ steps.build-and-push-admission.outputs.digest }}
          TAGS: quay.io/reshapr/reshapr-admission:${{env.IMAGE_TAG}} docker.io/reshapr/reshapr-admission:${{env.IMAGE_TAG}}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --new-bundle-format=false --use-signing-config=false --yes ${images}